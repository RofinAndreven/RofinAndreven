name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 17 * * *"   # daily at 00:00 Jakarta time
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa  # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # Publish the generated SVGs to the `output` branch
      - uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd  # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
